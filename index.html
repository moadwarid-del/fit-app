<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>MaghribFit – معاينة التطبيق | تطوير معاذ العلوش</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:0px;padding-bottom:0px;--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mu:#6b756e;--pr:#1f7a4d;--pc:#dcf1e4;--er:#b3261e;--bd:#e1e5df;color-scheme:light}
:root[data-dk="1"]{color-scheme:dark}
html{scroll-padding-top:0px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:560px;margin-inline:auto}
#app{padding:14px 14px 90px}h1{font-size:22px;margin:6px 0}.mu,.sm{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:13px;font-weight:600;display:block;margin:10px 0 4px}
input[type=number],button{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=number]{width:100%}button{cursor:pointer}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border-radius:99px;padding:6px 14px}.chip.on{background:var(--pr);color:var(--bg);border-color:var(--pr)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0}.days .chip{white-space:nowrap}
.pick{display:flex;gap:14px;align-items:center;width:100%;text-align:right;padding:18px;margin:8px 0;background:var(--card);border-radius:14px}
.pick b{font-size:19px;display:block}.pick span.i{font-size:34px}
.tot{background:var(--pc)}.big{font-size:26px;font-weight:700;color:var(--pr)}
.ok{color:var(--pr);font-weight:600;font-size:13px}.no,.er{color:var(--er);font-size:13px}.er{margin:2px 0}
.it{display:flex;justify-content:space-between;font-size:14px;margin-top:3px}
.badge{font-size:11px;background:var(--pc);color:var(--pr);border-radius:99px;padding:1px 8px}
.save{width:100%;background:var(--pr);color:var(--bg);border-color:var(--pr);font-weight:700;margin-top:6px}.save:disabled{opacity:.4}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:0px}
nav button{flex:1;border:0;border-radius:0;background:none;padding:10px 4px;font-size:12px}nav button.on{color:var(--pr);font-weight:700}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pick{cursor:pointer;border:1px solid var(--bd);min-height:76px;color:var(--tx);font:inherit}.pick.add{border-style:dashed;background:none}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.x{border:0;background:none;font-size:20px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:12px;margin:6px 0;border-radius:12px;background:var(--card);border:2px solid var(--bd);color:var(--tx)}
.opt.on{border-color:var(--pr);background:var(--pc)}.opt .i{font-size:26px}.opt b,.opt .sm{display:block}
input[type=text]{width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.bx{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%}.bx b{font-size:17px}

:root{--sp:#d9650b;--spc:#fde6d2}:root[data-dk="1"]{--sp:#ffa45c;--spc:#43301f}
.top{gap:10px}.steps{display:flex;gap:5px;width:84px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.steps i.on{background:var(--pr)}
.avs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.av{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:18px 10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:18px;cursor:pointer;min-height:168px;color:var(--tx);font:inherit}
.av .a{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--pc);margin-bottom:4px}.av .a.sp{background:var(--spc)}
.av b{font-size:16px}.av.add{border-style:dashed;background:none;justify-content:center}.av.add .a{font-size:36px;color:var(--pr);background:none;border:2px dashed var(--pr)}
.last{position:absolute;top:8px;inset-inline-start:8px;font-size:10px;color:var(--pr);font-weight:700}
.rm{position:absolute;top:6px;inset-inline-end:6px;width:30px;height:30px;border-radius:50%;padding:0;background:var(--er);color:#fff;border:0}
.mc{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:16px;margin:12px 0;background:var(--card);border:2px solid var(--bd);border-radius:20px;cursor:pointer;color:var(--tx);font:inherit}
.mc .ic{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--pc)}.mc.sp .ic{background:var(--spc)}
.mc.sp{border-color:var(--sp)}.mc.nm{border-color:var(--pr)}.mt{flex:1}.mt b{display:block;font-size:19px}.mt .sm{display:block}
.ls{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:13px}.nm .ls{color:var(--pr)}.sp .ls{color:var(--sp)}.go{font-size:28px;color:var(--mu)}
.hint{background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mu)}
.steps{direction:rtl}.ftr{position:sticky;bottom:0;z-index:5;margin:18px -14px 0;padding:12px 14px calc(12px + 0px);background:linear-gradient(to top,var(--bg) 70%,transparent)}.ftr .save{margin:0}

#app.wz{height:100dvh;padding:10px 14px calc(12px + 0px);display:flex;flex-direction:column;overflow:hidden}
#app.wz>*{animation:none}
#app.wz .top,#app.wz h1,#app.wz>.sm{flex:none}
#app.wz h1{font-size:clamp(22px,4.2vh,28px);margin:2px 0 0}
#app.wz .wzb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(2px,1.2vh,12px);overflow:hidden}
#app.wz label{margin:clamp(4px,1.2vh,12px) 0 clamp(2px,.6vh,6px)}
#app.wz label.ck{margin:clamp(2px,.6vh,8px) 0;padding:clamp(6px,1.3vh,13px) 14px;font-size:13px}
#app.wz input[type=number],#app.wz input[type=text]{padding:clamp(6px,1.3vh,13px) 12px;font-size:16px}
#app.wz .g3{grid-template-columns:repeat(3,1fr)}#app.wz .g3 label{font-size:12px;white-space:nowrap}
#app.wz .chips .chip{padding:clamp(8px,1.5vh,11px) 22px}
#app.wz .opt{margin:clamp(3px,.8vh,6px) 0;padding:clamp(8px,1.4vh,12px) 14px}
#app.wz .opt .i{width:clamp(38px,6vh,50px);height:clamp(38px,6vh,50px)}
#app.wz #dyn .card{display:none}#app.wz #dyn .er{font-size:12px}
#app.wz #res .card{margin:0}
#app.wz .ftr{position:static;margin:8px 0 0;padding:0;background:none;flex:none}

#app.hs{height:100dvh;padding:10px 14px calc(12px + 0px);display:flex;flex-direction:column;overflow:hidden}
#app.hs>*{animation:none}
#app.hs .top{flex:none;margin:0 0 2px}#app.hs .brand{margin:0;font-size:20px}
#app.hs .hh{flex:none;font-size:clamp(24px,4.6vh,30px);margin:0}#app.hs .mu{flex:none}
#app.hs .tiles{flex:1 1 0;min-height:0;max-height:240px;margin:clamp(6px,1.4vh,14px) 0}
#app.hs .tile{min-height:0;height:100%;padding:clamp(10px,2vh,16px)}
#app.hs .tile .ico{width:clamp(40px,7vh,64px);height:clamp(40px,7vh,64px);border-radius:16px}
#app.hs .tile .ico svg{width:clamp(24px,4vh,36px);height:clamp(24px,4vh,36px)}
#app.hs .tile b{font-size:clamp(17px,2.8vh,21px);margin-top:6px}
#app.hs .tile .tgo{width:30px;height:30px;top:12px;left:12px}
#app.hs .tile:before{width:120px;height:120px}
#app.hs[data-n="3"] .tile .d,#app.hs[data-n="4"] .tile .d{display:none}
#app.hs[data-n="3"] .tile,#app.hs[data-n="4"] .tile,#app.hs[data-n="5"] .tile{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
#app.hs[data-n="3"] .tile .ico,#app.hs[data-n="4"] .tile .ico{margin:0;align-self:center;width:44px;height:44px}
#app.hs[data-n="3"] .tile b,#app.hs[data-n="4"] .tile b{margin:0;font-size:17px}
#app.hs .hint{flex:none;margin-top:10px}
#app.hs>.row{flex:none;margin:6px 0 2px !important}
#app.hs .prw{flex:none;margin:clamp(3px,.8vh,8px) 0;padding:clamp(6px,1.2vh,12px) 14px}
#app.hs .prw .a{width:clamp(36px,6vh,50px);height:clamp(36px,6vh,50px);border-radius:13px}
#app.hs .prw .a svg{width:22px;height:22px}
#app.hs[data-n="4"] .prw,#app.hs[data-n="5"] .prw{padding:6px 12px;margin:3px 0}
#app.hs[data-n="4"] .prw .a,#app.hs[data-n="5"] .prw .a{width:36px;height:36px}
#app.hs .prw .t b{font-size:15px}

#app.hs .lgw{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#app.hs .lgi{flex:1 1 0;min-height:0;max-width:92%;object-fit:contain}
#app.hs .lgw .brand{flex:none;display:block;font-size:clamp(22px,3.8vh,30px);margin:0;text-align:center}
